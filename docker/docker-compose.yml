# Self-hosted SearXNG — the primary WebSearchProvider for Gruvle Verify's evidence
# research pipeline. Free, keyless, aggregates multiple upstream search engines.
# Start with: docker compose -f docker/docker-compose.yml up -d
# Then set SEARXNG_BASE_URL=http://localhost:8080 in .env.local (already the default).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: gruvle-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=2
    restart: unless-stopped
